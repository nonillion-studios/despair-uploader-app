name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm install

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build scraper sidecar (PyInstaller, Windows)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pyinstaller --onefile --name scraper-sidecar python/scraper_sidecar.py
          mkdir -p src-tauri/binaries
          cp dist/scraper-sidecar.exe src-tauri/binaries/scraper-sidecar-x86_64-pc-windows-msvc.exe

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Despair Uploader v__VERSION__"
          releaseBody: "تحديث تلقائي من آخر كود مدفوع."
          releaseDraft: false
          prerelease: false
